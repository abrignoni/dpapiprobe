name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 22.04 still ships the older Python versions this library supports; newer
    # runner images (26.04) dropped 3.9 from the hosted tool cache.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pylint
          # test-only: the reader dpapiprobe used up to 0.5.1, as an oracle for the boot key
          pip install python-registry==1.3.1
      - name: Lint
        # dpapiprobe/vendor holds ewfprobe/qnxprobe/regfprobe copied verbatim; they are
        # guarded by their own repos, not linted here, so skip that directory.
        run: python -m pylint dpapiprobe --disable=C,R --ignore=vendor
      - name: Test
        run: pytest -q
