name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 22.04 still ships the older Python versions this library supports; newer
    # runner images (26.04) dropped 3.9 from the hosted tool cache.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pylint
      - name: Lint
        run: python -m pylint dpapiprobe --disable=C,R
      - name: Test
        run: pytest -q
