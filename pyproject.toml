[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dpapiprobe"
version = "0.3.0"
description = "Offline Windows DPAPI decryption library (clean-room, MIT)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Alexis Brignoni" }]
keywords = ["dpapi", "windows", "forensics", "dfir", "decryption"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Operating System :: OS Independent",
]
dependencies = [
    "pycryptodome>=3.10",
    "python-registry>=1.3",
]

[project.urls]
Homepage = "https://github.com/abrignoni/dpapiprobe"

[project.scripts]
dpapiprobe = "dpapiprobe.cli:main"

[tool.setuptools.packages.find]
include = ["dpapiprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
